{% extends 'admin/master.html' %}

{% block body %}
<div class="container-fluid mt-3">
    {% if current_user.is_authenticated %}
    <div class="alert alert-success">
        <h4>Chào mừng quản trị viên <strong>{{ current_user.name }}</strong>!</h4>
        <p class="mb-0">Chọn các danh mục trên thanh menu phía trên để quản lý hệ thống PlanePlan.</p>
    </div>
    {% else %}
    <div class="alert alert-warning">
        Bạn chưa đăng nhập với quyền quản trị viên.
    </div>
    {% endif %}
</div>
{% endblock %}
