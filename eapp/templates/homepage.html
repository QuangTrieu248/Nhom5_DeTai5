
{% extends 'layout/base.html' %}

{% block title %}Trang chủ{% endblock %}

{% block content %}
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center fw-bold mb-2">Tìm kiếm chuyến bay đi</h2>
                        <p class="text-center text-muted mb-4">Chào mừng bạn quay trở lại với PlanePlan</p>

                        <form method="GET" action="{{ url_for('flight_page_view') }}" id="searchFlightForm">
                            <!-- Chọn loại vé -->
                            <div class="mb-3 d-flex justify-content-center gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="loai_ve" id="mot_chieu"
                                           value="mot_chieu" checked>
                                    <label class="form-check-label fw-semibold" for="mot_chieu">Một chiều</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="loai_ve" id="khu_hoi"
                                           value="khu_hoi">
                                    <label class="form-check-label fw-semibold" for="khu_hoi">Khứ hồi</label>
                                </div>
                            </div>

                            <!-- Sân bay đi -->
                            <div class="mb-3">
                                <label for="noi_di" class="form-label fw-semibold">Chọn sân bay đi</label>
                                <select class="form-select" id="noi_di" name="noi_di" required>
                                    <option value="" selected disabled>-- Chọn sân bay đi --</option>
                                    {% for a in airports %}
                                        <option value="{{ a.id }}">{{ a.name }} ({{ a.address }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Sân bay đến -->
                            <div class="mb-3">
                                <label for="noi_den" class="form-label fw-semibold">Chọn sân bay đến</label>
                                <select class="form-select" id="noi_den" name="noi_den" required>
                                    <option value="" selected disabled>-- Chọn sân bay đến --</option>
                                    {% for a in airports %}
                                        <option value="{{ a.id }}">{{ a.name }} ({{ a.address }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Ngày đi & Ngày về -->
                            <div class="mb-4">
                                <label for="dayGo" class="form-label fw-semibold">Ngày đi</label>
                                <input type="date" class="form-control" id="dayGo" name="dayGo" required>

                                <div id="khu_hoi_container" class="mt-3 d-none">
                                    <label for="dayBack" class="form-label fw-semibold">Ngày về</label>
                                    <input type="date" class="form-control" id="dayBack" name="dayBack">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Tìm kiếm</button>
                            <a href="{{ url_for('flight_page_view') }}" class="d-block text-center mt-2">Xem tất cả
                                chuyến bay</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const motChieuRadio = document.getElementById("mot_chieu");
            const khuHoiRadio = document.getElementById("khu_hoi");
            const khuHoiContainer = document.getElementById("khu_hoi_container");
            const noiDi = document.getElementById("noi_di");
            const noiDen = document.getElementById("noi_den");
            const dayGoInput = document.getElementById("dayGo");
            const dayBackInput = document.getElementById("dayBack");
            const form = document.getElementById("searchFlightForm");

            // 1. Không cho chọn ngày đi trong quá khứ
            const today = new Date().toISOString().split("T")[0];
            dayGoInput.setAttribute("min", today);

            // 2. Ngày về tối thiểu phải bằng ngày đi
            dayGoInput.addEventListener("change", function () {
                dayBackInput.setAttribute("min", this.value);
                if (dayBackInput.value && dayBackInput.value < this.value) {
                    dayBackInput.value = this.value;
                }
            });

            // 3. Ẩn/hiện ngày về
            function toggleKhuHoi() {
                if (khuHoiRadio.checked) {
                    khuHoiContainer.classList.remove("d-none");
                    dayBackInput.setAttribute("required", "required");
                    if (dayGoInput.value) dayBackInput.setAttribute("min", dayGoInput.value);
                } else {
                    khuHoiContainer.classList.add("d-none");
                    dayBackInput.removeAttribute("required");
                    dayBackInput.value = "";
                }
            }

            motChieuRadio.addEventListener("change", toggleKhuHoi);
            khuHoiRadio.addEventListener("change", toggleKhuHoi);

            // 4. Chặn chọn trùng sân bay đi và đến
            form.addEventListener("submit", function (e) {
                if (noiDi.value && noiDen.value && noiDi.value === noiDen.value) {
                    e.preventDefault();
                    alert("Sân bay đi và sân bay đến không được trùng nhau!");
                }
            });
        });
    </script>

{% endblock %}
