<footer class="mt-5">
    <style>
        .planeplan-footer {
            background: linear-gradient(135deg, #0b4f8a 0%, #0288d1 60%, #00acc1 100%);
            color: #ffffff;
            box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.12);
        }
        .planeplan-footer-brand {
            color: #ffd54f;
            font-size: 26px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
        }
        .planeplan-footer-link {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 999px;
            transition: all 0.2s ease;
            display: inline-block;
        }
        .planeplan-footer-link:hover {
            color: #ffd54f;
            background-color: rgba(255, 255, 255, 0.15);
        }
        .footer-group-badge {
            background-color: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            padding: 5px 16px;
            font-weight: 600;
            color: #ffd54f;
        }
    </style>

    <div class="planeplan-footer pt-4 pb-3">
        <div class="container-fluid px-4">
            <div class="row align-items-center gy-3 pb-3">
                <!-- Logo & Tên hệ thống -->
                <div class="col-md-6 d-flex align-items-center">
                    <a href="{{ url_for('home_view') }}" class="d-flex align-items-center text-decoration-none">
                        <img src="{{ url_for('static', filename='Logo1-removebg-preview.png') }}"
                             alt="Logo" width="46" class="me-2">
                        <div>
                            <div class="planeplan-footer-brand lh-1">PlanePlan</div>
                            <small class="text-white-50">Hệ thống đặt vé & quản lý chuyến bay trực tuyến</small>
                        </div>
                    </a>
                </div>

                <!-- Liên kết điều hướng nhanh -->
                <div class="col-md-6 d-flex flex-wrap justify-content-md-end gap-2">
                    <a href="{{ url_for('home_view') }}" class="planeplan-footer-link small">Trang chủ</a>
                    <a href="{{ url_for('flight_search') }}" class="planeplan-footer-link small">Tìm kiếm chuyến bay</a>
                    {% if current_user.is_authenticated %}
                    <a href="{{ url_for('my_tickets_view') }}" class="planeplan-footer-link small">Vé đã đặt</a>
                    {% endif %}
                </div>
            </div>

            <!-- Dòng bản quyền & Thông tin nhóm -->
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3"
                 style="border-top: 1px solid rgba(255, 255, 255, 0.2);">
                <span class="small text-white-50">
                    PlanePlan Website
                </span>
                <span class="footer-group-badge small">
                    Nhóm 5 - HCMC-OU
                </span>
            </div>
        </div>
    </div>
</footer>
