{% extends 'layout/base.html' %}

{% block title %}Đăng nhập - PlanePlan{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center fw-bold mb-2">Đăng nhập</h2>
                    <p class="text-center text-muted mb-4">Chào mừng bạn quay trở lại với PlanePlan</p>

                    {% if err_msg %}
                    <div class="alert alert-danger" role="alert">
                        {{ err_msg }}
                    </div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('login_process') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Tên đăng nhập</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Nhập tên đăng nhập..." required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Nhập mật khẩu..." required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            Đăng nhập
                        </button>

                    </form>
                    <hr class="my-4">
                    <p class="text-center mb-0 text-muted">
                        Chưa có tài khoản?
                        <a href="{{ url_for('register_view') }}" class="text-decoration-none fw-semibold">Đăng ký ngay</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
