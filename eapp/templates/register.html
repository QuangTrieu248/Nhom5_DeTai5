{% extends 'layout/base.html' %}

{% block title %}Đăng ký - PlanePlan{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center fw-bold mb-2">Tạo tài khoản mới</h2>
                    <p class="text-center text-muted mb-4">Đăng ký thành viên để đặt vé cùng PlanePlan</p>

                    <form method="POST" action="{{ url_for('register_view') }}">
                        <div class="mb-3">
                            <label for="fullname" class="form-label fw-semibold">Họ và tên</label>
                            <input type="text" class="form-control" id="fullname" name="fullname"
                                   placeholder="Nguyễn Văn A" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label fw-semibold">Tên đăng nhập</label>
                                <input type="text" class="form-control" id="username" name="username"
                                       placeholder="Nhập username..." required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label fw-semibold">Số điện thoại</label>
                                <input type="tel" class="form-control" id="phone" name="phone"
                                       placeholder="09xxxxxxxx" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="cccd_real" class="form-label fw-semibold">CCCD</label>
                            <!-- Ô hiển thị cho người dùng thấy -->
                            <input type="text" class="form-control" id="cccd_display" maxlength="12" placeholder="Nhập 12 số CCCD" required>
                            <!-- Ô ẩn lưu số CCCD thật để gửi về server, phần mở rộng thêm thẻ <script để ẩn số cccd nhập vào -->
                            <input type="hidden" class="form-control" id="cccd_real" name="cccd">
                        </div>
                        <div class="mb-3">
                            <label for="avartar" class="form-label fw-semibold">Avartar</label>
                            <input type="file" class="form-control" id="avartar" name="avarta"
                                   placeholder="name@example.com" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="Tạo mật khẩu..." required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="confirm_password" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                                       placeholder="Nhập lại mật khẩu..." required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            Đăng ký
                        </button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center mb-0 text-muted">
                        Đã có tài khoản?
                        <a href="{{ url_for('login_view') }}" class="text-decoration-none fw-semibold">Đăng nhập tại đây</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
